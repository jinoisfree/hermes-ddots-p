<h1>Hermes Gmail</h1>
<p>Hermes Gmail은 소유자 한 사람이 자신의 Gmail 편지함을 자신의 컴퓨터에서 읽고 정리하기 위해 쓰는 개인용 앱입니다. 일반에 제공하는 서비스가 아니며, 소유자 외의 사용자는 받지 않습니다.</p>
<p>앱은 소유자의 컴퓨터에서만 동작하고, 메일 내용을 외부 서버에 저장하거나 제3자에게 제공하지 않습니다.</p>
